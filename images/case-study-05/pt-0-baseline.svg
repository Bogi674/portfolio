<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baseline: a single HTML file saving to one browser, shared only as stale Excel exports, so every teammate holds a diverging copy">
  <defs>
    <style>
      text{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;fill:#1a2438;}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}
      .eyebrow{fill:#2b71ad;font-size:12px;font-weight:600;letter-spacing:1.2px;}
      .h{font-size:15px;font-weight:800;}
      .lbl{fill:rgba(26,36,56,0.62);font-size:12.5px;font-weight:600;}
      .sub{fill:rgba(26,36,56,0.42);font-size:11px;}
      .box{fill:#ffffff;stroke:rgba(20,28,44,0.14);stroke-width:1.5;}
      .stale{stroke:rgba(26,36,56,0.4);stroke-width:1.6;fill:none;stroke-dasharray:5 4;}
      .amberchip{fill:rgba(240,169,61,0.16);stroke:#f0a93d;stroke-width:1.4;}
    </style>
    <marker id="arrStale" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="rgba(26,36,56,0.4)"/></marker>
  </defs>

  <rect width="800" height="380" fill="#ffffff"/>
  <text class="mono eyebrow" x="32" y="40">BASELINE</text>
  <text class="h" x="32" y="64">One HTML file, saved to the browser it was opened in</text>

  <!-- three diverging local copies -->
  <g>
    <!-- copy 1 -->
    <rect class="box" x="32" y="96" width="220" height="150" rx="12"/>
    <circle cx="56" cy="122" r="7" fill="#eaf3fb" stroke="#c3d9ee"/>
    <text class="lbl" x="72" y="126">Teammate A</text>
    <text class="sub mono" x="176" y="126">localStorage</text>
    <rect x="52" y="146" width="180" height="14" rx="3" fill="#eaf3fb"/>
    <rect x="52" y="168" width="180" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="52" y="190" width="120" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="52" y="212" width="150" height="14" rx="3" fill="#f4f6f9"/>
  </g>
  <g>
    <rect class="box" x="290" y="96" width="220" height="150" rx="12"/>
    <circle cx="314" cy="122" r="7" fill="#eaf3fb" stroke="#c3d9ee"/>
    <text class="lbl" x="330" y="126">Teammate B</text>
    <text class="sub mono" x="434" y="126">localStorage</text>
    <rect x="310" y="146" width="180" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="310" y="168" width="140" height="14" rx="3" fill="#eaf3fb"/>
    <rect x="310" y="190" width="180" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="310" y="212" width="100" height="14" rx="3" fill="#f4f6f9"/>
  </g>
  <g>
    <rect class="box" x="548" y="96" width="220" height="150" rx="12"/>
    <circle cx="572" cy="122" r="7" fill="#eaf3fb" stroke="#c3d9ee"/>
    <text class="lbl" x="588" y="126">Teammate C</text>
    <text class="sub mono" x="692" y="126">localStorage</text>
    <rect x="568" y="146" width="120" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="568" y="168" width="180" height="14" rx="3" fill="#f4f6f9"/>
    <rect x="568" y="190" width="160" height="14" rx="3" fill="#eaf3fb"/>
    <rect x="568" y="212" width="180" height="14" rx="3" fill="#f4f6f9"/>
  </g>

  <!-- stale excel handoff -->
  <path class="stale" d="M142,246 L142,286" marker-end="url(#arrStale)"/>
  <path class="stale" d="M400,246 L400,286" marker-end="url(#arrStale)"/>
  <path class="stale" d="M658,246 L658,286" marker-end="url(#arrStale)"/>

  <rect class="box" x="300" y="292" width="200" height="52" rx="10"/>
  <text class="mono lbl" x="322" y="315">export.xls</text>
  <text class="sub" x="322" y="333">emailed around, stale on arrival</text>

  <text class="mono" x="520" y="320" font-size="12" fill="#e87500" font-weight="600">every copy quietly diverges</text>
</svg>
