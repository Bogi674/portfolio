<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Iteration 2: status pills, drag-to-reorder rows, and rich-text fields turn a flat editable table into something that feels like a real tool">
  <defs>
    <style>
      text{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;fill:#1a2438;}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}
      .eyebrow{fill:#2b71ad;font-size:12px;font-weight:600;letter-spacing:1.2px;}
      .h{font-size:15px;font-weight:800;}
      .note{fill:#e87500;font-size:11.5px;font-weight:600;}
      .box{fill:#ffffff;stroke:rgba(20,28,44,0.14);stroke-width:1.5;}
      .callout{stroke:#e87500;stroke-width:1.3;fill:none;}
    </style>
  </defs>

  <rect width="800" height="380" fill="#ffffff"/>
  <text class="mono eyebrow" x="32" y="40">ITERATION 2</text>
  <text class="h" x="32" y="64">Same data, but now it behaves like a tool</text>

  <!-- top callouts -->
  <text class="note" x="112" y="104">grip: drag to reorder</text>
  <text class="note" x="360" y="104">status as a tappable pill</text>
  <text class="note" x="600" y="104" text-anchor="middle">rich text in fields</text>
  <path class="callout" d="M120,112 L66,182"/>
  <path class="callout" d="M404,112 L396,168"/>
  <path class="callout" d="M600,112 L560,182"/>

  <!-- tracker row card -->
  <rect class="box" x="32" y="176" width="736" height="86" rx="12"/>

  <!-- drag grip -->
  <g>
    <circle cx="60" cy="210" r="1.8" fill="rgba(26,36,56,0.5)"/><circle cx="60" cy="218" r="1.8" fill="rgba(26,36,56,0.5)"/><circle cx="60" cy="226" r="1.8" fill="rgba(26,36,56,0.5)"/>
    <circle cx="68" cy="210" r="1.8" fill="rgba(26,36,56,0.5)"/><circle cx="68" cy="218" r="1.8" fill="rgba(26,36,56,0.5)"/><circle cx="68" cy="226" r="1.8" fill="rgba(26,36,56,0.5)"/>
  </g>

  <!-- work item -->
  <text class="mono" x="92" y="206" font-size="11" fill="rgba(26,36,56,0.42)">WORK ITEM</text>
  <text x="92" y="228" font-size="13.5" font-weight="700">Q3 onboarding revamp</text>

  <!-- status pill -->
  <rect x="330" y="202" width="132" height="30" rx="15" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <circle cx="350" cy="217" r="5" fill="#2b71ad"/>
  <text x="364" y="221" font-size="12.5" font-weight="600" fill="#2b71ad">In Progress</text>
  <path d="M444,214 l6,6 l6,-6" fill="none" stroke="#2b71ad" stroke-width="1.6"/>

  <!-- next action rich text -->
  <text class="mono" x="500" y="206" font-size="11" fill="rgba(26,36,56,0.42)">NEXT ACTION</text>
  <text x="500" y="228" font-size="13">review <tspan font-weight="800">BRD</tspan> with ops</text>

  <!-- export flow -->
  <path d="M400,262 L400,300" stroke="rgba(26,36,56,0.35)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <rect class="box" x="296" y="300" width="208" height="52" rx="10"/>
  <text class="mono" x="318" y="323" font-size="12.5" fill="rgba(26,36,56,0.62)" font-weight="600">export.xlsx</text>
  <text x="318" y="341" font-size="11" fill="rgba(26,36,56,0.42)">formatting flattened to plain text</text>
</svg>
