<svg viewBox="0 0 720 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The hardening pass: undo, presence fix, mention and sign-in fixes, checkpoint grouping, and a split into nine focused modules behind a small entry point">
  <defs>
    <style>
      text{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;fill:#1a2438;}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}
    </style>
    <marker id="arr5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#2b71ad"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#ffffff"/>

  <!-- Header -->
  <text class="mono" x="32" y="42" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#2b71ad">THE HARDENING PASS</text>
  <text x="32" y="66" font-size="15" font-weight="800">Confidence for the team, a spine that scales</text>

  <!-- ===== LEFT COLUMN: Confidence and Fixes (x=32, w=318) ===== -->
  <text class="mono" x="32" y="100" font-size="10.5" font-weight="600" fill="rgba(26,36,56,0.45)" letter-spacing="0.8">CONFIDENCE AND FIXES</text>

  <!-- Fix row 1: undo (y=110 to y=152) -->
  <rect x="32" y="110" width="318" height="42" rx="9" fill="#ffffff" stroke="rgba(20,28,44,0.14)" stroke-width="1.4"/>
  <text class="mono" x="50" y="128" font-size="11.5" font-weight="700" fill="#e87500">undo x5</text>
  <text x="50" y="144" font-size="10.5" fill="rgba(26,36,56,0.42)">Ctrl/Cmd Z: edits, status, add, delete, reorder</text>

  <!-- Fix row 2: presence (y=160 to y=202) -->
  <rect x="32" y="160" width="318" height="42" rx="9" fill="#ffffff" stroke="rgba(20,28,44,0.14)" stroke-width="1.4"/>
  <text class="mono" x="50" y="178" font-size="11.5" font-weight="700" fill="#e87500">presence</text>
  <text x="50" y="194" font-size="10.5" fill="rgba(26,36,56,0.42)">server timestamp, no more clock flicker</text>

  <!-- Fix row 3: mentions (y=210 to y=252) -->
  <rect x="32" y="210" width="318" height="42" rx="9" fill="#ffffff" stroke="rgba(20,28,44,0.14)" stroke-width="1.4"/>
  <text class="mono" x="50" y="228" font-size="11.5" font-weight="700" fill="#e87500">mentions</text>
  <text x="50" y="244" font-size="10.5" fill="rgba(26,36,56,0.42)">email normalized, click jumps to the row</text>

  <!-- Fix row 4: sign-in (y=260 to y=302) -->
  <rect x="32" y="260" width="318" height="42" rx="9" fill="#ffffff" stroke="rgba(20,28,44,0.14)" stroke-width="1.4"/>
  <text class="mono" x="50" y="278" font-size="11.5" font-weight="700" fill="#e87500">sign-in</text>
  <text x="50" y="294" font-size="10.5" fill="rgba(26,36,56,0.42)">forced account chooser</text>

  <!-- Fix row 5: checkpoints (y=310 to y=352) -->
  <rect x="32" y="310" width="318" height="42" rx="9" fill="#ffffff" stroke="rgba(20,28,44,0.14)" stroke-width="1.4"/>
  <text class="mono" x="50" y="328" font-size="11.5" font-weight="700" fill="#e87500">checkpoints</text>
  <text x="50" y="344" font-size="10.5" fill="rgba(26,36,56,0.42)">group by week / month, collapsible</text>

  <!-- Vertical divider -->
  <line x1="368" y1="96" x2="368" y2="374" stroke="rgba(20,28,44,0.1)" stroke-width="1.2"/>

  <!-- ===== RIGHT COLUMN: Nine Modules (x=380, w=308) ===== -->
  <text class="mono" x="380" y="100" font-size="10.5" font-weight="600" fill="rgba(26,36,56,0.45)" letter-spacing="0.8">ONE SCRIPT, NINE MODULES</text>

  <!-- Entry point box: x=380, y=110, w=308, h=38 -->
  <rect x="380" y="110" width="308" height="38" rx="9" fill="rgba(240,169,61,0.16)" stroke="#f0a93d" stroke-width="1.5"/>
  <text class="mono" x="534" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#e87500">tracker.js  (entry point)</text>

  <!-- Arrow connectors from entry box (y=148) to module row 1 (y=170) -->
  <!-- Three arrows at module center x values: 430, 534, 638 -->
  <line x1="430" y1="148" x2="430" y2="168" stroke="#2b71ad" stroke-width="1.3" marker-end="url(#arr5)"/>
  <line x1="534" y1="148" x2="534" y2="168" stroke="#2b71ad" stroke-width="1.3" marker-end="url(#arr5)"/>
  <line x1="638" y1="148" x2="638" y2="168" stroke="#2b71ad" stroke-width="1.3" marker-end="url(#arr5)"/>

  <!-- Module grid: 3 cols x 3 rows
       Col x values: 380, 488, 596 (width=100 each, gap=8)
       Row y values: 170, 212, 254 (height=34 each, gap=8) -->

  <!-- Row 1 -->
  <rect x="380" y="170" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="430" y="191" text-anchor="middle" font-size="11" fill="#2b71ad">firebase</text>

  <rect x="488" y="170" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="538" y="191" text-anchor="middle" font-size="11" fill="#2b71ad">constants</text>

  <rect x="596" y="170" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="646" y="191" text-anchor="middle" font-size="11" fill="#2b71ad">state</text>

  <!-- Row 2 -->
  <rect x="380" y="212" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="430" y="233" text-anchor="middle" font-size="11" fill="#2b71ad">ui</text>

  <rect x="488" y="212" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="538" y="233" text-anchor="middle" font-size="11" fill="#2b71ad">richtext</text>

  <rect x="596" y="212" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="646" y="233" text-anchor="middle" font-size="11" fill="#2b71ad">collab</text>

  <!-- Row 3 -->
  <rect x="380" y="254" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="430" y="275" text-anchor="middle" font-size="11" fill="#2b71ad">data</text>

  <rect x="488" y="254" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="538" y="275" text-anchor="middle" font-size="11" fill="#2b71ad">grid</text>

  <rect x="596" y="254" width="100" height="34" rx="8" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.3"/>
  <text class="mono" x="646" y="275" text-anchor="middle" font-size="11" fill="#2b71ad">export</text>

  <!-- Sequencing note below modules -->
  <text x="380" y="314" font-size="10.5" fill="rgba(26,36,56,0.42)">Sequence held: shared vars to one state object,</text>
  <text x="380" y="330" font-size="10.5" fill="rgba(26,36,56,0.42)">validate, then slice. State reached via setters.</text>
</svg>
