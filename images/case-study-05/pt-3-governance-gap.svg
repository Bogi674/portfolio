<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The gap sync could not close: one open shared database with no identity, where anyone with the link can edit and nothing records who changed what">
  <defs>
    <style>
      text{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;fill:#1a2438;}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}
    </style>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#e87500"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#ffffff"/>

  <!-- Header -->
  <text class="mono" x="32" y="42" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#e87500">THE FRICTION SYNC COULD NOT FIX</text>
  <text x="32" y="66" font-size="15" font-weight="800">Shared truth, but no boundaries and no record</text>

  <!-- Open padlock icon, centered above DB, at y=88 -->
  <!-- Lock body: 32x22px, shackle above, total height ~40px -->
  <g transform="translate(344, 86)">
    <!-- Lock body -->
    <rect x="0" y="18" width="32" height="22" rx="4" fill="rgba(240,169,61,0.16)" stroke="#e87500" stroke-width="1.6"/>
    <!-- Open shackle: left arm goes up, right arm raised/disconnected -->
    <path d="M6,18 L6,8 A10,10 0 0 1 26,8" fill="none" stroke="#e87500" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Keyhole dot -->
    <circle cx="16" cy="27" r="2.4" fill="#e87500"/>
  </g>
  <!-- "open" label below padlock -->
  <text class="mono" x="360" y="144" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e87500">open</text>

  <!-- Shared data cylinder: cx=360, top cy=164, bottom cy=234 -->
  <ellipse cx="360" cy="164" rx="80" ry="17" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.5"/>
  <path d="M280,164 L280,234 A80,17 0 0 0 440,234 L440,164" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.5"/>
  <ellipse cx="360" cy="234" rx="80" ry="17" fill="#eaf3fb" stroke="#c3d9ee" stroke-width="1.5"/>
  <!-- Label -->
  <text x="360" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#2b71ad">shared data</text>

  <!-- Cylinder visible bottom at y=234+17=251 -->
  <!-- Five anonymous user circles at cy=312, r=18 -->
  <!-- cx values: 68, 186, 360, 534, 652 -->

  <!-- Arrows from circle tops (y=312-18=294) up toward cylinder bottom (y=251) -->
  <!-- Arrow tips stop just short of cylinder border -->
  <path d="M68,293 C90,274 180,263 298,255" stroke="#e87500" stroke-width="1.6" fill="none" marker-end="url(#arr3)"/>
  <path d="M186,293 C210,277 285,265 316,257" stroke="#e87500" stroke-width="1.6" fill="none" marker-end="url(#arr3)"/>
  <path d="M360,293 L360,255" stroke="#e87500" stroke-width="1.6" fill="none" marker-end="url(#arr3)"/>
  <path d="M534,293 C510,277 435,265 404,257" stroke="#e87500" stroke-width="1.6" fill="none" marker-end="url(#arr3)"/>
  <path d="M652,293 C630,274 540,263 422,255" stroke="#e87500" stroke-width="1.6" fill="none" marker-end="url(#arr3)"/>

  <!-- Anonymous user circles -->
  <circle cx="68" cy="312" r="18" fill="#ffffff" stroke="rgba(26,36,56,0.3)" stroke-width="1.5"/>
  <text x="68" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="rgba(26,36,56,0.45)">?</text>

  <circle cx="186" cy="312" r="18" fill="#ffffff" stroke="rgba(26,36,56,0.3)" stroke-width="1.5"/>
  <text x="186" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="rgba(26,36,56,0.45)">?</text>

  <circle cx="360" cy="312" r="18" fill="#ffffff" stroke="rgba(26,36,56,0.3)" stroke-width="1.5"/>
  <text x="360" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="rgba(26,36,56,0.45)">?</text>

  <circle cx="534" cy="312" r="18" fill="#ffffff" stroke="rgba(26,36,56,0.3)" stroke-width="1.5"/>
  <text x="534" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="rgba(26,36,56,0.45)">?</text>

  <circle cx="652" cy="312" r="18" fill="#ffffff" stroke="rgba(26,36,56,0.3)" stroke-width="1.5"/>
  <text x="652" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="rgba(26,36,56,0.45)">?</text>

  <!-- Warning note -->
  <text class="mono" x="360" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e87500">anyone with the link edits, nothing records who</text>
</svg>
