<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect width="780" height="320" fill="#f6f8fb" rx="0"/>

  <!-- Left panel: Old Architecture -->
  <rect x="20" y="20" width="340" height="280" rx="12" fill="#ffffff" stroke="#e8ecf2" stroke-width="1.5"/>

  <!-- Left panel header -->
  <rect x="20" y="20" width="340" height="44" rx="12" fill="#f4f5f7" stroke="#e8ecf2" stroke-width="1.5"/>
  <rect x="20" y="44" width="340" height="20" fill="#f4f5f7"/>
  <text x="45" y="47" font-size="9" font-family="ui-monospace, monospace" fill="#9aaab8" letter-spacing="0.1em" text-anchor="start" font-weight="500">ORIGINAL ARCHITECTURE</text>
  <text x="45" y="60" font-size="12" fill="#8a3030" font-weight="600" letter-spacing="0.02em">Deprecated</text>
  <line x1="138" y1="54" x2="148" y2="54" stroke="#8a3030" stroke-width="1.5"/>
  <line x1="144" y1="50" x2="144" y2="58" stroke="#8a3030" stroke-width="1.5"/>

  <!-- Old hierarchy nodes -->
  <!-- Platform -->
  <rect x="130" y="82" width="100" height="32" rx="7" fill="#f4f5f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="180" y="103" font-size="12" fill="#738290" text-anchor="middle" font-weight="600">Platform</text>

  <!-- Arrow down -->
  <line x1="180" y1="114" x2="180" y2="124" stroke="#d8e0ea" stroke-width="1.5"/>
  <polygon points="180,128 175,120 185,120" fill="#d8e0ea"/>

  <!-- Project -->
  <rect x="130" y="128" width="100" height="32" rx="7" fill="#f4f5f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="180" y="149" font-size="12" fill="#738290" text-anchor="middle" font-weight="600">Project</text>

  <!-- Arrow down -->
  <line x1="180" y1="160" x2="180" y2="170" stroke="#d8e0ea" stroke-width="1.5"/>
  <polygon points="180,174 175,166 185,166" fill="#d8e0ea"/>

  <!-- Workstream -->
  <rect x="115" y="174" width="130" height="32" rx="7" fill="#f4f5f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="180" y="195" font-size="12" fill="#738290" text-anchor="middle" font-weight="600">Workstream</text>

  <!-- Arrow down -->
  <line x1="180" y1="206" x2="180" y2="216" stroke="#d8e0ea" stroke-width="1.5"/>
  <polygon points="180,220 175,212 185,212" fill="#d8e0ea"/>

  <!-- Entry (polymorphic) -->
  <rect x="85" y="220" width="190" height="32" rx="7" fill="#fce8e8" stroke="#f4b8b8" stroke-width="1.5"/>
  <text x="180" y="241" font-size="12" fill="#8a3030" text-anchor="middle" font-weight="600">Entry (polymorphic)</text>

  <!-- Sub-types -->
  <text x="180" y="270" font-size="10" fill="#9aaab8" text-anchor="middle">Notes · Files · Tasks · Reminders · Links</text>

  <!-- Caption: problem -->
  <text x="190" y="292" font-size="10" fill="#b8c8d6" text-anchor="middle" font-style="italic">Too many layers before you can write anything</text>


  <!-- Right panel: New Architecture -->
  <rect x="420" y="20" width="340" height="280" rx="12" fill="#ffffff" stroke="#bfd2ec" stroke-width="1.5"/>

  <!-- Right panel header -->
  <rect x="420" y="20" width="340" height="44" rx="12" fill="#dce8f6" stroke="#bfd2ec" stroke-width="1.5"/>
  <rect x="420" y="44" width="340" height="20" fill="#dce8f6"/>
  <text x="445" y="47" font-size="9" font-family="ui-monospace, monospace" fill="#4a6090" letter-spacing="0.1em" text-anchor="start" font-weight="500">NEW ARCHITECTURE</text>
  <text x="445" y="60" font-size="12" fill="#4a6090" font-weight="600" letter-spacing="0.02em">Current (v1.0 onward)</text>

  <!-- Notes center node -->
  <rect x="525" y="82" width="110" height="40" rx="8" fill="#4a6090" stroke="none"/>
  <text x="580" y="98" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Notes</text>
  <text x="580" y="112" font-size="9" fill="rgba(255,255,255,0.75)" text-anchor="middle">Rich text + Checklists</text>

  <!-- Spaces node -->
  <rect x="440" y="160" width="100" height="36" rx="8" fill="#dce8f6" stroke="#bfd2ec" stroke-width="1.5"/>
  <text x="490" y="181" font-size="12" fill="#4a6090" text-anchor="middle" font-weight="600">Spaces</text>
  <text x="490" y="193" font-size="9" fill="#4a6090" text-anchor="middle" opacity="0.7">Optional org</text>

  <!-- Widgets node -->
  <rect x="620" y="160" width="100" height="36" rx="8" fill="#dce8f6" stroke="#bfd2ec" stroke-width="1.5"/>
  <text x="670" y="181" font-size="12" fill="#4a6090" text-anchor="middle" font-weight="600">Widgets</text>
  <text x="670" y="193" font-size="9" fill="#4a6090" text-anchor="middle" opacity="0.7">Reminder · File · Link</text>

  <!-- Connecting lines from Notes to Spaces and Widgets -->
  <line x1="550" y1="122" x2="510" y2="160" stroke="#bfd2ec" stroke-width="1.5"/>
  <line x1="610" y1="122" x2="650" y2="160" stroke="#bfd2ec" stroke-width="1.5"/>

  <!-- Spaces children -->
  <rect x="440" y="220" width="100" height="30" rx="6" fill="#f4f5f7" stroke="#e8ecf2" stroke-width="1"/>
  <text x="490" y="232" font-size="9.5" fill="#738290" text-anchor="middle" font-weight="500">3-level nesting</text>
  <text x="490" y="244" font-size="9" fill="#9aaab8" text-anchor="middle">Materialized path</text>
  <line x1="490" y1="196" x2="490" y2="220" stroke="#e8ecf2" stroke-width="1.5"/>

  <!-- Widgets children -->
  <rect x="620" y="220" width="100" height="30" rx="6" fill="#f4f5f7" stroke="#e8ecf2" stroke-width="1"/>
  <text x="670" y="232" font-size="9.5" fill="#738290" text-anchor="middle" font-weight="500">Attached below</text>
  <text x="670" y="244" font-size="9" fill="#9aaab8" text-anchor="middle">note body</text>
  <line x1="670" y1="196" x2="670" y2="220" stroke="#e8ecf2" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="590" y="286" font-size="10" fill="#738290" text-anchor="middle">Open app. Start writing. Organize later if needed.</text>
  <text x="590" y="298" font-size="9" fill="#9aaab8" text-anchor="middle" font-style="italic">Zero decisions required before capture</text>

  <!-- Center divider arrow -->
  <text x="390" y="168" font-size="22" fill="#e8ecf2" text-anchor="middle"></text>
  <polygon points="403,162 390,155 390,169" fill="#d8e0ea"/>
  <line x1="370" y1="162" x2="400" y2="162" stroke="#d8e0ea" stroke-width="2"/>

</svg>
