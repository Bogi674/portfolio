<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="760" height="280" fill="#f4f6f9"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8891a0"/>
  </marker>
</defs>

<text x="30" y="34" text-anchor="start" font-size="12" font-weight="700" fill="#8891a0" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.06em">THE REMAINING FRICTION</text>
<text x="30" y="54" font-size="13" fill="#5b6478" font-family="Arial, Helvetica, sans-serif">Speed fixed the reply. The handoff after it was never touched.</text>
<rect x="161.8" y="94" width="436.5" height="106" rx="14" fill="#fbe7e4"/>
<text x="380.0" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#b5401c" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.06em">THE DETOUR</text>
<rect x="20.0" y="108" width="138" height="78" rx="10" fill="#eaf3fb" stroke="#2b71ad" stroke-width="1.5"/>
<text x="89.0" y="139.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">Deal agreed</text>
<text x="89.0" y="155.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">in WhatsApp chat</text>
<rect x="165.5" y="108" width="138" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="234.5" y="139.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">Customer leaves</text>
<text x="234.5" y="155.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">WhatsApp</text>
<rect x="311.0" y="108" width="138" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="380.0" y="139.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">Opens app, logs in,</text>
<text x="380.0" y="155.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">finds plafond menu</text>
<rect x="456.5" y="108" width="138" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="525.5" y="139.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">Re-applies, waits for</text>
<text x="525.5" y="155.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">same agent to review</text>
<rect x="602.0" y="108" width="138" height="78" rx="10" fill="#eaf3fb" stroke="#2b71ad" stroke-width="1.5"/>
<text x="671.0" y="139.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">Sent to branch</text>
<text x="671.0" y="155.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a2438">for signing</text>
<line x1="162.0" y1="147.0" x2="161.5" y2="147.0" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="307.5" y1="147.0" x2="307.0" y2="147.0" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="453.0" y1="147.0" x2="452.5" y2="147.0" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="598.5" y1="147.0" x2="598.0" y2="147.0" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="525.5" y="232" text-anchor="middle" font-size="12.5" fill="#b5401c" font-family="Arial, Helvetica, sans-serif" font-style="italic">Same telemarketer, same information, all over again</text>
</svg>