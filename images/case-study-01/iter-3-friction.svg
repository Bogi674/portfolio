<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="760" height="280" fill="#f4f6f9"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8891a0"/>
  </marker>
</defs>

<text x="30" y="34" text-anchor="start" font-size="12" font-weight="700" fill="#8891a0" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.06em">THE REMAINING FRICTION</text>
<text x="30" y="54" font-size="13" fill="#5b6478" font-family="Arial, Helvetica, sans-serif">Speed fixed the reply. The handoff after it was never touched.</text>

<!-- Detour highlight around friction steps (boxes 2-4) -->
<rect x="162" y="100" width="432" height="104" rx="14" fill="#fbe7e4"/>
<text x="378" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="#b5401c" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.06em">THE DETOUR</text>

<!-- Box 1: Deal agreed in WhatsApp (cx=77) -->
<rect x="17" y="108" width="120" height="78" rx="10" fill="#eaf3fb" stroke="#2b71ad" stroke-width="1.5"/>
<text x="77" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">Deal agreed</text>
<text x="77" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">in WhatsApp chat</text>

<!-- Box 2: Customer leaves WhatsApp (cx=228) -->
<rect x="168" y="108" width="120" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="228" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">Customer leaves</text>
<text x="228" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">WhatsApp</text>

<!-- Box 3: Opens app, logs in (cx=379) -->
<rect x="319" y="108" width="120" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="379" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">Opens app, logs in,</text>
<text x="379" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">finds plafond menu</text>

<!-- Box 4: Re-applies (cx=530) -->
<rect x="470" y="108" width="120" height="78" rx="10" fill="#ffffff" stroke="#e1e5eb" stroke-width="1.5"/>
<text x="530" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">Re-applies, waits</text>
<text x="530" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">for same agent</text>

<!-- Box 5: Branch signing (cx=681) -->
<rect x="621" y="108" width="120" height="78" rx="10" fill="#eaf3fb" stroke="#2b71ad" stroke-width="1.5"/>
<text x="681" y="138" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">Sent to branch</text>
<text x="681" y="155" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a2438">for signing</text>

<!-- Arrows between boxes (left-to-right, proper direction) -->
<line x1="139" y1="147" x2="165" y2="147" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290" y1="147" x2="316" y2="147" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="441" y1="147" x2="467" y2="147" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="592" y1="147" x2="618" y2="147" stroke="#8891a0" stroke-width="2" marker-end="url(#arrow)"/>

<text x="378" y="238" text-anchor="middle" font-size="12.5" fill="#b5401c" font-family="Arial, Helvetica, sans-serif" font-style="italic">Same telemarketer, same information, all over again</text>
</svg>
